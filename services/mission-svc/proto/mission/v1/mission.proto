syntax = "proto3";

package mission.v1;

import "google/api/annotations.proto";

option go_package = "github.com/single-pass-recon/mission-svc/gen/mission/v1;missionv1";

service MissionService {
  rpc CreateMission(CreateMissionRequest) returns (CreateMissionResponse) {
    option (google.api.http) = { post: "/v1/missions" body: "*" };
  }

  rpc GetMissionStatus(GetMissionStatusRequest) returns (GetMissionStatusResponse) {
    option (google.api.http) = { get: "/v1/missions/{mission_id}/status" };
  }

  // Internal, service-to-service only. No REST annotation: not part of the
  // public contract . Called by ingest-svc's FinalizeIngest.
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
}

message CreateMissionRequest {
  string name = 1;
  string area_of_interest_geojson = 2; // raw GeoJSON Polygon text
  string classification = 3;
  repeated string expected_sensors = 4;
  string operator_id = 5;
}

message CreateMissionResponse {
  string mission_id = 1;
}

message GetMissionStatusRequest {
  string mission_id = 1;
}

message GetMissionStatusResponse {
  string mission_id = 1;
  string status = 2;
  repeated StageStatus stages = 3;
}

message StageStatus {
  string stage = 1;
  string state = 2;      // pending|running|completed|failed
  double progress_pct = 3;
  string output_uri = 4;
}

message CreateRunRequest {
  string mission_id = 1;
  string preset = 2;
}

message CreateRunResponse {
  string run_id = 1;
  string temporal_workflow_id = 2;
}
