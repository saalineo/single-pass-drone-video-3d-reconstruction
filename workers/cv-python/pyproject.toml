[tool.poetry]
name = "cv-python"
version = "0.1.0"
description = "Python Temporal activity workers for the CV reconstruction pipeline"
authors = ["Reconstruction Platform Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
temporalio = "^1.7.0"
opencv-python-headless = "^4.10.0.84"
torch = { version = "2.3.1+cu121", source = "pytorch-cu121" }
torchvision = { version = "0.18.1+cu121", source = "pytorch-cu121" }
numpy = "^1.26.4"
scipy = "^1.13.1"
pydantic = "^2.7.4"
boto3 = "^1.34.131"
ffmpeg-python = "^0.2.0"
structlog = "^24.1.0"
python-dateutil = "^2.9.0"
pyproj = "^3.6.1"

[[tool.poetry.source]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
