[project]
name = "cv-python"
version = "0.1.0"
description = "Python Temporal activity workers for the CV reconstruction pipeline"
authors = [{name = "Reconstruction Platform Team"}]
requires-python = "==3.12.*"
dependencies = [
    "boto3>=1.34.131",
    "ffmpeg-python>=0.2.0",
    "numpy>=1.26.4",
    "opencv-python-headless>=4.10.0.84",
    "pycolmap>=4.1.1",
    "pydantic>=2.7.4",
    "pyproj>=3.6.1",
    "python-dateutil>=2.9.0",
    "scipy>=1.13.1",
    "structlog>=24.1.0",
    "temporalio>=1.7.0",
    "transformers>=4.42.0",
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "laspy[lazrs]>=2.7.0",
    "rasterio>=1.5.0",
    "trimesh>=5.0.0",
    "plyfile>=1.1.5",
    "cryptography>=42.0.0",
    "open3d>=0.19.0",
    "asyncpg>=0.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
