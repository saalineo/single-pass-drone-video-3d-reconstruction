---
apiVersion: v1
kind: Namespace
metadata:
  name: recon-orchestration
  labels:
    recon.io/bounded-context: workflow-control
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: recon-messaging
  labels:
    recon.io/bounded-context: eventing
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: recon-gpu
  labels:
    recon.io/bounded-context: cv-pipeline
    pod-security.kubernetes.io/enforce: privileged  # GPU device plugin + gVisor/Kata runtimes (doc05 §5)
