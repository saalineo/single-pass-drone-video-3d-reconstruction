apiVersion: v1
kind: Secret
metadata:
  name: minio-worker-scoped-credentials
  namespace: recon-datastores
type: Opaque
stringData:
  # Dedicated scoped IAM credential for external CV workers (e.g. Google Colab)
  access-key: "recon-worker-colab"
  secret-key: "change-me-worker-scoped-secret-key"
  # Policy restricting worker access to read raw ingest footage and read/write reconstruction artifacts
  policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:ListBucket"
          ],
          "Resource": [
            "arn:aws:s3:::recon-raw",
            "arn:aws:s3:::recon-raw/*"
          ]
        },
        {
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject",
            "s3:ListBucket"
          ],
          "Resource": [
            "arn:aws:s3:::recon-dev",
            "arn:aws:s3:::recon-dev/*",
            "arn:aws:s3:::recon-prod",
            "arn:aws:s3:::recon-prod/*"
          ]
        }
      ]
    }
