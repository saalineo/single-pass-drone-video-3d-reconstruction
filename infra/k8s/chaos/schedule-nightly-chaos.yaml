apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: nightly-datalink-loss
  namespace: core-gateway
spec:
  schedule: "0 2 * * *"
  startingDeadlineSeconds: 60
  concurrencyPolicy: Forbid
  historyLimit: 5
  type: NetworkChaos
  networkChaos:
    action: loss
    mode: all
    selector:
      namespaces: [core-gateway]
      labelSelectors: {app: wireguard-gateway}
    loss:
      loss: "100"
    duration: "6m"
